name: "代码分析"
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  rhttp-native:
    name: Rhttp 原生回调生命周期
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 验证锁定原生源码的取消与回调收尾
        env:
          RUSTFLAGS: --cfg reqwest_unstable
        run: cargo test --locked --manifest-path packages/rhttp/rust/Cargo.toml --lib

  rust-advisories:
    name: Rhttp 依赖安全公告
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Advisory only. The local rhttp carries a callback-drain patch that the
    # published package does not, so it cannot be swapped for the pub.dev
    # release to inherit upstream's dependency bumps. Failing the build here
    # would leave every push red for advisories this repository cannot fix
    # without forking the patch forward; the report is uploaded instead.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: 安装固定版本的审计工具
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: 扫描锁定的 Rust 依赖
        run: |
          mkdir -p build/security
          cargo audit --file packages/rhttp/rust/Cargo.lock \
            2>&1 | tee build/security/rust-audit.log
      - name: 保留审计结果
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-dependency-audit
          path: build/security/rust-audit.log
          if-no-files-found: ignore
          retention-days: 30

  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: python3 .github/scripts/release_version.py --check
      - run: python3 .github/scripts/check_structure_imports.py
      - run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py"
      - run: flutter pub get --enforce-lockfile
      - name: 准备并验证独立代码审查工具
        working-directory: tool/code_audit
        run: |
          dart pub get --enforce-lockfile
          dart run bin/self_check.dart
          dart analyze --fatal-infos
      - run: dart tool/check_git_dependencies.dart
      - name: 检查本次修改的 Dart 格式
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ -n "${BASE_SHA:-}" ]]; then
            diff_range="${BASE_SHA}...HEAD"
          else
            diff_range="HEAD^...HEAD"
          fi
          mapfile -t dart_files < <(git diff --diff-filter=ACMRTUXB --name-only "$diff_range" -- '*.dart')
          if (( ${#dart_files[@]} == 0 )); then
            echo "本次没有修改 Dart 文件。"
            exit 0
          fi
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"
      - run: flutter analyze --fatal-infos --fatal-warnings

