name: 完整构建
run-name: 完整构建 ${{ github.ref_name }}

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  Release_Metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 校验发布元数据
        run: python3 .github/scripts/validate_release.py

  Quality:
    needs: Release_Metadata
    uses: ./.github/workflows/analyze.yml

  Build:
    needs: [Release_Metadata, Quality]
    uses: ./.github/workflows/build.yml
    with:
      build_android: true
    secrets: inherit

  Release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [Release_Metadata, Quality, Build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: 校验发布元数据
        run: python3 .github/scripts/validate_release.py --write-notes release_notes.md
      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          path: outputs
          merge-multiple: true
      - name: 创建草稿 Release 并上传资产
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(
            outputs/*.apk
          )
          if (( ${#files[@]} == 0 )); then
            echo "没有找到可发布的构建产物。" >&2
            exit 1
          fi

          args=(
            --title "${GITHUB_REF_NAME}"
            --notes-file release_notes.md
            --draft
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" "${args[@]}"
      - name: 发布草稿 Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
      - name: 清理 jsDelivr CDN 缓存
        run: |
          curl -s "https://purge.jsdelivr.net/gh/QiongHHHZZZ/VeneraQ@main/pubspec.yaml" | jq '.status'
          curl -s "https://purge.jsdelivr.net/gh/QiongHHHZZZ/VeneraQ@main/CHANGELOG.md" | jq '.status'
