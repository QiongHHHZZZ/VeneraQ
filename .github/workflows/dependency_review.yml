name: 依赖安全审查

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency_review:
    name: 依赖安全审查
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: 检查新增依赖漏洞
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          show-patched-versions: true

  rust_audit:
    name: Rust 锁定依赖漏洞扫描
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 安装固定版本的审计工具
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: 扫描完整 Rust 锁文件
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/security
          cargo audit --file packages/rhttp/rust/Cargo.lock --deny unsound 2>&1 | tee build/security/rust-audit.log
      - name: 保留依赖审计结果
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-dependency-audit
          path: build/security/rust-audit.log
          if-no-files-found: ignore
          retention-days: 14
