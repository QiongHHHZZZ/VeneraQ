name: 构建
run-name: 构建 ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      build_android:
        required: false
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEY_PROPERTIES:
        required: false
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建 Android'
        required: true
        type: boolean
        default: true

concurrency:
  group: build-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build_Android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: 释放 Android 构建所需磁盘空间
        run: rm -rf /opt/hostedtoolcache
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 解码并安装 Android 证书
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE }}
          PROPERTY_FILE: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$STORE_FILE" | base64 --decode > android/keystore.jks
          echo "$PROPERTY_FILE" > android/key.properties
      - uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android
      - name: 配置 Gradle 插件仓库
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/plugin-repositories.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF
      - name: 检查 rust-toolchain.toml
        run: rustup show
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release
      - name: 上传 APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: apk-armeabi-v7a
          path: build/app/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 7
      - name: 上传 APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: apk-arm64-v8a
          path: build/app/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7
      - name: 上传 APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: apk-x86_64
          path: build/app/outputs/apk/release/*x86_64*.apk
          if-no-files-found: error
          retention-days: 7
      - name: 上传 APK (universal)
        uses: actions/upload-artifact@v7
        with:
          name: apk-universal
          path: build/app/outputs/apk/release/*-android.apk
          if-no-files-found: error
          retention-days: 7

